---
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag push carries the tag in the ref; a manual run carries the selected
      # branch there, so the tag must come from the input. The input is
      # user-controlled, so it reaches the shell through `env:` only.
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag=$EVENT_TAG
          else
            tag=$REF_NAME
          fi
          if [ -z "$tag" ]; then
            echo "no tag to publish: pass the tag input on a manual run" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # actions/checkout rewrites a tag pushed event to a lightweight tag at the
      # commit, so fetch the annotated tag object back before validating it.
      - name: Restore annotated tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"

      # Version, changelog heading, and link definitions as the tag records them.
      - name: Check release metadata
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh tests/release-check.sh tag "$TAG"

      # The changelog section is the only copy of the notes.
      - name: Extract release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh tests/release-check.sh notes "$TAG" > "$RUNNER_TEMP/release-notes.md"

      # Re-running must not fail on an existing release, so edit first.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
