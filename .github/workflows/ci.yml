---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The official action from the Salam repository. The version is pinned
      # so a new compiler release cannot break CI without a code change here;
      # bump it deliberately.
      - name: Setup Salam
        uses: SalamLang/Salam/.github/actions/setup-salam@main
        with:
          version: '0.5.5'

      - name: Show compiler version
        run: salam version

      # Format check, library build, examples build, test suite.
      - name: make check
        run: make check
