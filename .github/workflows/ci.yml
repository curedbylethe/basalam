---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Version, changelog headings, and link definitions must agree. One leg
      # only: the check is read-only and needs no compiler.
      - name: Check release metadata
        if: runner.os == 'Linux'
        run: make release-check

      # The official action from the Salam repository. The version is pinned
      # so a new compiler release cannot break CI without a code change here;
      # bump it deliberately.
      - name: Setup Salam
        uses: SalamLang/Salam/.github/actions/setup-salam@main
        with:
          version: '0.5.6'

      - name: Show compiler version
        run: salam version

      # Format check, library build, examples build, test suite, doc examples.
      - name: make check
        run: make check

      # LLVM strict: an LLVM codegen failure must not fall back to the C backend.
      - name: make test-llvm
        run: make test-llvm

  docs:
    runs-on: ubuntu-latest
    env:
      MINTLIFY_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The CLI is pinned so a new Mintlify release cannot break CI without a
      # deliberate change in this file; bump it on purpose.
      - name: Install the Mintlify CLI
        run: npm i -g mint@4.2.988

      # The formatter must be idempotent on every committed page.
      - name: Check the docs format
        run: make docs-format-check

      # MDX and frontmatter validation, then the link and anchor check.
      - name: Check the docs
        run: make docs-check
